<!doctype html>
<html lang="pt-BR" data-mantine-color-scheme="light">
  <head>
    <!-- Resolve light/dark scheme before first paint to prevent theme flash. -->
    <script>
      try {
        var s = localStorage.getItem('mantine-color-scheme-value');
        var d =
          s === 'dark' ||
          (s !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute(
          'data-mantine-color-scheme',
          d ? 'dark' : 'light',
        );
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/gemini-code/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Code: demonstração</title>
    <meta
      name="description"
      content="Demonstração do Gemini Code com dados de exemplo: o painel de verdade, sem instalar nada. Um espaço aberto de vários agentes de código feitos em torno do Google Gemini."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,100..1000,0..100&family=Google+Sans+Code:wght@400..700&display=swap"
    />

    <link rel="stylesheet" crossorigin href="/gemini-code/assets/demo-B25IcyrD.css">
  </head>

  </body>
</html>
