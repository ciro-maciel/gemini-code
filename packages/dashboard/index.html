<!doctype html>
<html lang="en" data-mantine-color-scheme="light">
    <head>
        <!-- Resolve light/dark scheme before first paint to prevent theme flash. -->
        <script>try{var s=localStorage.getItem('mantine-color-scheme-value');var d=s==='dark'||(s!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-mantine-color-scheme',d?'dark':'light')}catch(e){}</script>

        <meta name="apple-mobile-web-app-capable" content="yes" />
        <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />

        <meta name="description" content="Open-source autonomous coding agent workspace powered by Google Gemini, Material Design 3, MCP connectors, and hybrid local/cloud execution." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
