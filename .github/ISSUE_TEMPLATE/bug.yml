name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce
      description: The shortest steps that show it. Never paste keys or tokens.
    validations:
      required: true
  - type: input
    attributes:
      label: Model and transport
      description: For example gemini-3.5-flash-lite on an API key, or gemini-4-neon-low on the Google subscription.
