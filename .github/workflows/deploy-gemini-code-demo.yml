name: Gemini Code — demo

# The public demo of the panel (packages/dashboard/src/demo/): the real UI
# against an in-browser fake API with example data, on GitHub Pages from the
# gh-pages branch.
#
# - main publishes the demo at the site root: /gemini-code/
# - every pull request from a branch of this repository publishes a preview at
#   /gemini-code/preview/<branch>/ and comments the link on the pull request
# - closing the pull request (merged or not) removes its preview
#
# Each target has its own queue: GitHub keeps only one waiting run per
# concurrency group and cancels the older one, which once dropped a preview's
# removal behind a push to main. Runs of different targets may write gh-pages
# at the same time; each writes only its own folder and retries its push with
# a rebase, so they never conflict.
#
# Pull requests from forks and from Dependabot get no preview: their workflows
# have a read-only token, so the preview could never be removed.

on:
  push:
    branches: [main]
    paths:
      - 'packages/dashboard/**'
      - '.github/workflows/deploy-gemini-code-demo.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: demo-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: where
        name: Where this build lives
        env:
          BRANCH: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40)
            echo "base=/gemini-code/preview/$slug/" >> "$GITHUB_OUTPUT"
            echo "dir=preview/$slug" >> "$GITHUB_OUTPUT"
            echo "url=https://ciro-maciel.github.io/gemini-code/preview/$slug/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/gemini-code/" >> "$GITHUB_OUTPUT"
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "url=https://ciro-maciel.github.io/gemini-code/" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build:demo
        working-directory: packages/dashboard
        env:
          DEMO_BASE: ${{ steps.where.outputs.base }}
          DEMO_SITE_BASE: /gemini-code/
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0
      - name: Write this build into gh-pages
        env:
          DIR: ${{ steps.where.outputs.dir }}
          SHA: ${{ github.sha }}
        run: |
          cd site
          if [ "$DIR" = "." ]; then
            # The root build replaces the root and keeps every preview.
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name preview -exec rm -rf {} +
          else
            rm -rf "$DIR"
            mkdir -p "$DIR"
          fi
          cp -R ../packages/dashboard/dist/demo/. "$DIR/"
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "demo: $DIR from $SHA"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:gh-pages && exit 0
            sleep $((attempt * 3))
            git pull --rebase -q origin gh-pages
          done
          exit 1
      - name: Link the preview on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.where.outputs.url }}
        with:
          script: |
            const marker = '<!-- gemini-code-demo-preview -->';
            const body = `${marker}\n**Demo of this branch:** ${process.env.URL}\n\nIt updates on every push to the branch and goes away when the pull request closes. GitHub Pages takes a minute or two to serve a new version.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(comment => comment.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  remove-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Remove this branch's preview
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40)
          [ -d "preview/$slug" ] || { echo "no preview for $slug"; exit 0; }
          git rm -rq "preview/$slug"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "demo: remove preview/$slug"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:gh-pages && exit 0
            sleep $((attempt * 3))
            git pull --rebase -q origin gh-pages
          done
          exit 1
