name: Gemini Code — release

# One executable per system (bun build --compile, the Bun runtime inside),
# next to the dashboard's build and the cloud computer's code, packed as
# gemini-code-<os>-<arch>.tar.gz (zip on Windows) and published with
# SHA256SUMS on a GitHub Release. install.sh and install.ps1 download these.
#
# - a tag v* builds every system and publishes the release
# - workflow_dispatch builds every system and keeps the packs as artifacts,
#   publishing nothing
#
# Checks run on a machine before the tag (docs/install.md), not here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_VERSION: 1.4.0

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: packages/dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: packages/dashboard/dist
          retention-days: 3

  build:
    needs: dashboard
    # The signing secrets live here; the environment allows only main and v* tags.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: linux-x64,
              target: bun-linux-x64,
              runner: ubuntu-latest,
              exe: gemini-code,
            }
          - {
              name: linux-arm64,
              target: bun-linux-arm64,
              runner: ubuntu-latest,
              exe: gemini-code,
            }
          - {
              name: windows-x64,
              target: bun-windows-x64,
              runner: ubuntu-latest,
              exe: gemini-code.exe,
            }
          - {
              name: darwin-arm64,
              target: bun-darwin-arm64,
              runner: macos-latest,
              exe: gemini-code,
            }
          - {
              name: darwin-x64,
              target: bun-darwin-x64,
              runner: macos-latest,
              exe: gemini-code,
            }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then echo "value=${REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "value=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - name: Compile
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p out/gemini-code
          bun build --compile --minify --target=${{ matrix.target }} \
            --external @playwright/mcp --external playwright-core --external playwright \
            --define "process.env.GEMINI_CODE_VERSION=\"$VERSION\"" \
            packages/server/src/cli.js --outfile out/gemini-code/${{ matrix.exe }}
      # macOS: Developer ID, hardened runtime with the entitlements the Bun
      # runtime needs (packages/server/macos/entitlements.plist), then Apple
      # notarizes it, so a browser download opens with no warning. A bare
      # executable cannot be stapled: macOS checks the ticket online. Without
      # the secrets (a fork) it falls back to an ad hoc signature, which an
      # Apple silicon Mac needs to run it at all.
      - name: Sign and notarize for macOS
        if: startsWith(matrix.name, 'darwin')
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          BIN=out/gemini-code/gemini-code
          if [ -z "$CERTIFICATE" ]; then
            echo "no signing secrets: ad hoc signature"
            codesign --force --sign - "$BIN"
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KP="$(openssl rand -hex 16)"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | xargs)
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }
          codesign --force --timestamp --options runtime \
            --entitlements packages/server/macos/entitlements.plist \
            --sign "$IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_KEY" > "$KEY"
          ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 20m | tee "$RUNNER_TEMP/notary.txt"
          grep -q "status: Accepted" "$RUNNER_TEMP/notary.txt"
          rm -f "$KEY" "$RUNNER_TEMP/signing.p12"
          security delete-keychain "$KC"
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: out/gemini-code/dashboard
      - name: Add the cloud computer's code and the license
        run: |
          mkdir -p out/gemini-code/computer
          for file in server.js browser.js package.json bun.lock provision.sh; do
            if [ -f "packages/computer/$file" ]; then cp "packages/computer/$file" out/gemini-code/computer/; fi
          done
          cp LICENSE out/gemini-code/
      - name: Pack
        run: |
          cd out
          if [ "${{ matrix.name }}" = windows-x64 ]; then
            zip -qr "gemini-code-${{ matrix.name }}.zip" gemini-code
          else
            tar -czf "gemini-code-${{ matrix.name }}.tar.gz" gemini-code
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.name }}
          path: out/gemini-code-${{ matrix.name }}.*
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pack-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum gemini-code-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "Gemini Code $TAG" --generate-notes --verify-tag
