name: Gemini Code — testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run preflight
      - name: Changelog line for this pull request
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: bun scripts/check-changelog.js
