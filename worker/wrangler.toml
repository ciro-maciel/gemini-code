# Optional Cloudflare Worker gateway & routine wake-up alarm for cloud deployments.
# Fill in your Cloudflare account_id, KV namespace id, and custom domain before deploying.

name = "gemini-code-worker"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Every minute: checks whether any scheduled agent routine is due.
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "ALARM"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
CONTROL_URL = "https://your-control-server.example.com"
ALLOWED_ORIGINS = "http://localhost:5180"

# Set via `wrangler secret put`:
#   SPRITES_TOKEN  (if control server is hosted on a private Fly Sprite)
#   WAKE_SECRET    (shared secret for /api/wake and /alarm/next)
